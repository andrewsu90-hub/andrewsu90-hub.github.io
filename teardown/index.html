<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Teardown | Anzû Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Bebas+Neue&family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary-color:#f0f0f0;--secondary-color:#a3a3a3;--border-color:#333;--bg-light:#181818;--bg-white:#0c0c0c;--accent:#E67E22}
body{font-family:'DM Sans','Noto Sans TC',sans-serif;font-weight:300;background:var(--bg-white);color:var(--primary-color);min-height:100vh;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 3%;border-bottom:.5px solid var(--border-color);background:rgba(12,12,12,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
header .logo{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:700;color:var(--primary-color);text-decoration:none}
header .back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--secondary-color);text-decoration:none;padding:8px 16px;border:.5px solid var(--border-color);border-radius:6px;transition:all .2s}
header .back:hover{background:var(--accent);border-color:var(--accent);color:#0c0c0c}
main{max-width:1520px;margin:0 auto;padding:3rem 3% 5rem}
h1{font-family:'Bebas Neue',sans-serif;font-size:38px;font-weight:400;letter-spacing:.06em;margin-bottom:.6rem}
.lead{color:var(--secondary-color);font-size:14px;line-height:1.8;max-width:720px;margin-bottom:2rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;max-width:1000px}
.card{color:var(--primary-color);position:relative;display:block;overflow:hidden;text-decoration:none;background:rgba(24,24,24,.85);border:.5px solid var(--border-color);border-radius:14px;transition:all .3s ease}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent) 0%,transparent 80%);opacity:0;transition:opacity .3s ease;z-index:1}
.card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:0 20px 52px rgba(230,126,34,.16)}
.card:hover::before{opacity:1}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f4f2ed}
.card .body{padding:1.6rem 2rem 1.6rem}
.card h2{font-size:16.5px;font-weight:600;margin-bottom:.8rem;line-height:1.45}
.card p{font-size:13.5px;color:#c8c8c8;line-height:1.8;margin-bottom:1.3rem}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem}
.tags span{font-size:11.5px;padding:4px 10px;background:rgba(255,255,255,.04);border:.5px solid var(--border-color);border-radius:4px;color:var(--secondary-color)}
.open{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-top:.5px solid var(--border-color);padding-top:1.3rem;transition:color .2s}
.card:hover .open{color:var(--accent)}
#msg{color:var(--secondary-color);font-size:14px}
footer{text-align:center;padding:2rem 1rem 2.5rem;font-size:12px;color:var(--secondary-color)}
</style>
</head>
<body>
<header>
  <a class="logo" href="../index.html">Anzû Design Studio</a>
  <a class="back" href="../index.html#dfm"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>回到工具選單</a>
</header>
<main>
  <h1>Teardown</h1>
  <p class="lead">Interactive 3D teardown simulators generated from STEP assemblies — explode views, section cuts, subsystem isolation and guided tours, running entirely in the browser.</p>
  <div id="grid"></div>
  <p id="msg"></p>
</main>
<footer>© 2026 Anzû Design Studio · ANZU. All rights reserved.</footer>
<script>
fetch('projects.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).then(function(list){
  var g=document.getElementById('grid');
  if(!Array.isArray(list)||!list.length){document.getElementById('msg').textContent='No teardown models yet.';return;}
  list.slice().reverse().forEach(function(it){
    var a=document.createElement('a');a.className='card';a.href=(it.href||'').replace(/^teardown\//,'');
    if(it.thumb){var im=document.createElement('img');im.src='../'+it.thumb;im.alt=it.title;im.loading='lazy';a.appendChild(im);}
    var b=document.createElement('div');b.className='body';
    var h=document.createElement('h2');h.textContent=it.title;b.appendChild(h);
    var p=document.createElement('p');p.textContent=it.desc||'';b.appendChild(p);
    var t=document.createElement('div');t.className='tags';(it.tags||[]).forEach(function(x){var s=document.createElement('span');s.textContent=x;t.appendChild(s);});b.appendChild(t);
    var o=document.createElement('div');o.className='open';o.innerHTML='Open Tool <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg>';b.appendChild(o);
    a.appendChild(b);g.appendChild(a);
  });
}).catch(function(){document.getElementById('msg').textContent='Unable to load the list.';});
</script>
</body>
</html>
