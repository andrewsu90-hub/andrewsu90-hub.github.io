  motor_inertia: {

      return { A: A.toFixed(2), d1: d1.toFixed(2), d2: d2.toFixed(2), da1: (Mdu * (q + 2)).toFixed(2), da2: (2 * (A - 0.5 * d1 + Mdu)).toFixed(2), i: (Z2 / Z1).toFixed(0), lam: (Math.atan(Z1 / q) * 180 / Math.PI).toFixed(3) };

    calc(i) {

      const Lp = 2 * a0p + (i.z1 + i.z2) / 2 + ((i.z2 - i.z1) / (2 * Math.PI)) ** 2 / a0p;
      let Lp0 = Math.ceil(Lp);

      return { Lp: Lp.toFixed(3), Lp0, L: (Lp0 * i.p).toFixed(1), a: (i.p / 4 * (A + Math.sqrt(A ** 2 - 8 * ((i.z2 - i.z1) / (2 * Math.PI)) ** 2))).toFixed(1) };

    outputs: [{ key: "Pfmin", label: "\u6700\u5C0F\u63A5\u5408\u58D3\u5F37", unit: "MPa" }, { key: "delta_min", label: "\u6700\u5C0F\u6709\u6548\u904E\u76C8\u91CF", unit: "\u03BCm" }, { key: "Pfmax", label: "\u6700\u5927\u5141\u8A31\u58D3\u5F37", unit: "MPa" }, { key: "delta_max", label: "\u6700\u5927\u5141\u8A31\u904E\u76C8\u91CF", unit: "\u03BCm" }],
    calc(i) {
      const T_Nmm = i.T * 1e3;
      const Pfmin = 2 * T_Nmm / (Math.PI * i.df ** 2 * i.lf * i.mu);
      const qa = i.df / i.da, qi = i.di / i.df;
      const Ca = (1 + qa ** 2) / (1 - qa ** 2) + i.va, Ci = qi > 0 ? (1 + qi ** 2) / (1 - qi ** 2) - i.vi : 1 - i.vi;
      const dmin = (Pfmin * i.df * Ca / i.Ea + Pfmin * i.df * Ci / i.Ei) * 1e3;
      const Pfmax = Math.min(0.58 * i.ssa * (1 - qa ** 2), qi > 0 ? 0.58 * i.ssi * (1 - qi ** 2) : 0.58 * i.ssi);
      const dmax = (Pfmax * i.df * Ca / i.Ea + Pfmax * i.df * Ci / i.Ei) * 1e3;
      return { Pfmin: Pfmin.toFixed(2), delta_min: dmin.toFixed(1), Pfmax: Pfmax.toFixed(1), delta_max: dmax.toFixed(1) };
    }
  },
  thread_dims: {
    name: "\u516C\u5236\u87BA\u7D0B\u4E2D\u5C0F\u5F91\u8A08\u7B97",
    desc: "\u5167\u87BA\u7D0B\u4E2D\u5F91\u3001\u5C0F\u5F91\u8A08\u7B97",
    inputs: [{ key: "D", label: "\u516C\u7A31\u76F4\u5F91 D", unit: "mm", default: 20 }, { key: "P", label: "\u87BA\u8DDD P", unit: "mm", default: 2.5 }],
    outputs: [{ key: "D1", label: "\u5C0F\u5F91 D\u2081", unit: "mm" }, { key: "D2", label: "\u4E2D\u5F91 D\u2082", unit: "mm" }, { key: "da_min", label: "\u5916\u87BA\u7D0B\u5927\u5F91\u6700\u5C0F d_min", unit: "mm" }, { key: "pitch_remark", label: "\u5E38\u7528\u87BA\u8DDD\u5099\u8A3B", unit: "" }],

      const std = pitch_map[i.D];
      return { D1: D1.toFixed(5), D2: D2.toFixed(5), da_min: (i.D - 0.1).toFixed(2), pitch_remark: std ? `M${i.D} \u6A19\u6E96\u87BA\u8DDD ${std}mm` : "\u975E\u6A19\u6E96\u5C3A\u5BF8" };

  },

  // ══ 立柱 & 棘輪 ══
  column_buckling: {
    name: "\u7ACB\u67F1\uFF08\u8EF8\u5FC3\u58D3\u67F1\uFF09\u7A69\u5B9A\u6027",
    desc: "\u6B50\u62C9\u516C\u5F0F\u8A08\u7B97\u81E8\u754C\u529B",
    inputs: [{ key: "N", label: "\u8EF8\u5411\u58D3\u529B N", unit: "N", default: 5e4 }, { key: "L", label: "\u7ACB\u67F1\u9577\u5EA6 L", unit: "mm", default: 1e3 }, { key: "I", label: "\u622A\u9762\u6163\u6027\u77E9", unit: "mm\u2074", default: 25e4 }, { key: "A", label: "\u622A\u9762\u7A4D A", unit: "mm\xB2", default: 500 }, { key: "E", label: "\u5F48\u6027\u6A21\u91CF E", unit: "MPa", default: 206e3 }, { key: "mu1", label: "\u7D04\u675F\u4FC2\u6578 \u03BC\u2081", unit: "", default: 2, hint: "\u5169\u7AEF\u56FA\u5B9A:0.5 / \u4E00\u56FA\u4E00\u9278:0.7 / \u5169\u7AEF\u9278:1 / \u4E00\u56FA\u4E00\u81EA\u7531:2" }],
    outputs: [{ key: "i_r", label: "\u8FF4\u8F49\u534A\u5F91", unit: "mm" }, { key: "lam", label: "\u9577\u7D30\u6BD4 \u03BB", unit: "" }, { key: "Fcr", label: "\u6B50\u62C9\u81E8\u754C\u529B", unit: "N" }, { key: "safety", label: "\u7A69\u5B9A\u5B89\u5168\u4FC2\u6578", unit: "" }],
    calc(i) {
      const i_r = Math.sqrt(i.I / i.A);
      const Fcr = Math.PI ** 2 * i.E * i.I / (i.mu1 * i.L) ** 2;

    }
  },
  // ══ 新增計算器模組 ══
  // ── 凸輪（正弦加速度曲線）──
  cam_sine: {
    name: "\u6B63\u5F26\u52A0\u901F\u5EA6\u51F8\u8F2A\u8A2D\u8A08",
    desc: "\u8A08\u7B97\u51F8\u8F2A\u4F4D\u79FB\u3001\u901F\u5EA6\u3001\u52A0\u901F\u5EA6\uFF08\u4FEE\u6B63\u6B63\u5F26\u66F2\u7DDA\uFF09",
    inputs: [
      { key: "h", label: "\u884C\u7A0B h\uFF08\u5347\u7A0B\uFF09", unit: "mm", default: 30 },
      { key: "rb", label: "\u57FA\u5713\u534A\u5F91 rb", unit: "mm", default: 100 },
      { key: "phi_o", label: "\u63A8\u7A0B\u904B\u52D5\u89D2 \u03C6\u2080", unit: "\xB0", default: 120 },
      { key: "phi", label: "\u8A08\u7B97\u89D2\u5EA6 \u03C6\uFF080~\u03C6\u2080\uFF09", unit: "\xB0", default: 60 }
    ],
    outputs: [
      { key: "s", label: "\u4F4D\u79FB s", unit: "mm" },
      { key: "v_coef", label: "\u901F\u5EA6\u4FC2\u6578 ds/d\u03C6", unit: "mm/\xB0" },
      { key: "a_coef", label: "\u52A0\u901F\u5EA6\u4FC2\u6578", unit: "mm/\xB0\xB2" },
      { key: "r", label: "\u51F8\u8F2A\u5411\u5F91 r", unit: "mm" }
    ],
    calc(i) {
      const phi_r = i.phi * Math.PI / 180;
      const phi_o_r = i.phi_o * Math.PI / 180;
      const tau = phi_r / phi_o_r;
      const Vm = 1.76, Am = 5.53;
      let s, v, a;
      if (tau <= 0.25) {
        s = i.h * (Am / (4 * Math.PI ** 2)) * (Math.PI / 2 * tau - Math.sin(2 * Math.PI * tau) / 2);
        v = i.h / phi_o_r * Am / (4 * Math.PI) * (Math.PI / 2 * (1 - Math.cos(2 * Math.PI * tau)));
        a = i.h / phi_o_r ** 2 * Am / 2 * Math.sin(2 * Math.PI * tau);
      } else if (tau <= 0.75) {
        s = i.h * (Am / (4 * Math.PI ** 2) * (Math.PI * (tau - 0.25) + 1) - 1 / (2 * Math.PI) * Math.sin(2 * Math.PI * tau));
        v = i.h / phi_o_r * Am / (4 * Math.PI) * (Math.PI * (1 - Math.cos(2 * Math.PI * (tau - 0.25))));
        a = i.h / phi_o_r ** 2 * Am / 2 * Math.sin(2 * Math.PI * (tau - 0.25));
      } else {
        s = i.h * (1 - Am / (4 * Math.PI ** 2) * (Math.PI / 2 * (1 - tau) + Math.sin(2 * Math.PI * tau) / 2));
        v = i.h / phi_o_r * Am / (4 * Math.PI) * (Math.PI / 2 * (1 + Math.cos(2 * Math.PI * tau)));
        a = -i.h / phi_o_r ** 2 * Am / 2 * Math.sin(2 * Math.PI * tau);
      }
      const r = Math.sqrt((i.rb + s) ** 2 + v ** 2);
      return { s: s.toFixed(4), v_coef: v.toFixed(5), a_coef: a.toFixed(5), r: r.toFixed(3) };
    }
  },
  // ── 分割器選型 ──
  indexer_select: {
    name: "\u51F8\u8F2A\u5206\u5272\u5668\u9078\u578B\u8A08\u7B97",
    desc: "\u9593\u6B47\u56DE\u8F49\u8F49\u76E4\u96FB\u6A5F\u529F\u7387\u9078\u578B",
    inputs: [
      { key: "N", label: "\u5206\u5272\u7B49\u4EFD N", unit: "", default: 12 },
      { key: "t1", label: "\u5B9A\u4F4D\u6642\u9593 t\u2081", unit: "s", default: 1 },
      { key: "t2", label: "\u9A45\u52D5\u6642\u9593 t\u2082", unit: "s", default: 3 },
      { key: "n", label: "\u5165\u529B\u8EF8\u8F49\u901F n", unit: "rpm", default: 125 },
      { key: "D", label: "\u8F49\u76E4\u76F4\u5F91 D", unit: "cm", default: 60 },
      { key: "T", label: "\u8F49\u76E4\u539A\u5EA6 T", unit: "cm", default: 1.5 },
      { key: "M", label: "\u6750\u8CEA\u6BD4\u91CD\uFF08\u92FC:7.8\uFF09", unit: "kg/dm\xB3", default: 7.8 },
      { key: "M1", label: "\u5DE5\u4EF6\u91CD\u91CF M1", unit: "kg/\u7D44", default: 1 },
      { key: "M2", label: "\u593E\u5177\u91CD\u91CF M2", unit: "kg/\u7D44", default: 3 },
      { key: "Re", label: "\u593E\u5177PCD\u534A\u5F91 Re", unit: "cm", default: 30 },
      { key: "z", label: "\u96FB\u6A5F\u6548\u7387 z", unit: "", default: 0.7 },
      { key: "fe", label: "\u5B89\u5168\u4FC2\u6578 fe", unit: "", default: 1.5 }
    ],
    outputs: [
      { key: "phi_h", label: "\u9A45\u52D5\u89D2 \u03C6h", unit: "\xB0" },
      { key: "W1", label: "\u8F49\u76E4\u91CD\u91CF W1", unit: "kg" },
      { key: "JT", label: "\u7CFB\u7D71\u7E3D\u6163\u91CF JT", unit: "kg\xB7cm\xB2" },
      { key: "P_min", label: "\u96FB\u6A5F\u6700\u5C0F\u529F\u7387", unit: "kW" }
    ],
    calc(i) {
      const phi_h = 360 * i.t2 / (i.t1 + i.t2);
      const W1 = Math.PI / 4 * i.D ** 2 * i.T * i.M * 0.1 ** 3;
      const W2 = i.M1 * i.N, W3 = i.M2 * i.N;
      const JT_disk = W1 * i.D ** 2 / 8;
      const JT_fixture = (W2 + W3) * i.Re ** 2;
      const JT = JT_disk + JT_fixture;
      const omega = 2 * Math.PI * i.n / 60;
      const Vm = 1.76, Am = 5.53;
      const phi_h_r = phi_h * Math.PI / 180;
      const T_motor = JT * omega ** 2 * Am * i.fe / (phi_h_r * i.n * 60 / i.t2);
      const P_min = T_motor * omega / i.z / 1e3;
      return { phi_h: phi_h.toFixed(1), W1: W1.toFixed(2), JT: JT.toFixed(1), P_min: P_min.toFixed(3) };
    }
  },
  // ── 液壓：泵與電機 ──
  hydraulic_pump: {
    name: "\u6DB2\u58D3\u6CF5\u8207\u96FB\u6A5F\u9078\u578B",
    desc: "\u4F9D\u7CFB\u7D71\u58D3\u529B\u6D41\u91CF\u8A08\u7B97\u6CF5\u6392\u91CF\u8207\u96FB\u6A5F\u529F\u7387",
    inputs: [
      { key: "Q", label: "\u7CFB\u7D71\u6D41\u91CF Q", unit: "L/min", default: 135 },
      { key: "P", label: "\u7CFB\u7D71\u58D3\u529B P", unit: "bar", default: 200 },
      { key: "n", label: "\u96FB\u6A5F\u8F49\u901F n", unit: "rpm", default: 1450 },
      { key: "eta_v", label: "\u5BB9\u7A4D\u6548\u7387 \u03B7\u1D65", unit: "", default: 0.95 },
      { key: "eta_m", label: "\u6A5F\u68B0\u6548\u7387 \u03B7\u2098", unit: "", default: 0.85 }
    ],
    outputs: [
      { key: "Vg", label: "\u6CF5\u6392\u91CF Vg", unit: "mL/r" },
      { key: "P_kW", label: "\u96FB\u6A5F\u529F\u7387", unit: "kW" },
      { key: "T_motor", label: "\u96FB\u6A5F\u8F49\u77E9", unit: "N\xB7m" }
    ],
    calc(i) {
      const Vg = i.Q * 1e3 / (i.n * i.eta_v);
      const P_kW = i.Q * i.P / (600 * i.eta_v * i.eta_m);
      const T_motor = P_kW * 1e3 * 60 / (2 * Math.PI * i.n);
      return { Vg: Vg.toFixed(2), P_kW: P_kW.toFixed(2), T_motor: T_motor.toFixed(2) };
    }
  },
  // ── 液壓：管路壓損 ──
  hydraulic_pipe: {
    name: "\u6DB2\u58D3\u7BA1\u8DEF\u58D3\u529B\u640D\u5931",
    desc: "\u8A08\u7B97\u76F4\u7BA1\u6BB5\u58D3\u640D\u8207\u6D41\u901F\uFF08\u5C64\u6D41/\u7D0A\u6D41\uFF09",
    inputs: [
      { key: "Q", label: "\u6D41\u91CF Q", unit: "L/min", default: 70 },
      { key: "d", label: "\u7BA1\u8DEF\u5167\u5F91 d", unit: "mm", default: 15 },
      { key: "L", label: "\u7BA1\u8DEF\u9577\u5EA6 L", unit: "m", default: 5 },
      { key: "nu", label: "\u904B\u52D5\u9ECF\u5EA6 \u03BD", unit: "cSt", default: 46, hint: "ISO VG46\u6DB2\u58D3\u6CB9\u5E38\u6EAB\u7D0446 cSt" },
      { key: "rho", label: "\u6CB9\u6DB2\u5BC6\u5EA6 \u03C1", unit: "kg/m\xB3", default: 870 }
    ],
    outputs: [
      { key: "v", label: "\u6D41\u901F", unit: "m/s" },
      { key: "Re", label: "\u96F7\u8AFE\u6578 Re", unit: "" },
      { key: "type", label: "\u6D41\u614B", unit: "" },
      { key: "dp", label: "\u7BA1\u8DEF\u58D3\u640D \u0394p", unit: "bar" }
    ],
    calc(i) {
      const A = Math.PI / 4 * (i.d / 1e3) ** 2;
      const v = i.Q / 6e4 / A;
      const Re = v * (i.d / 1e3) / (i.nu * 1e-6);
      const laminar = Re < 2300;
      let lambda;
      if (laminar) lambda = 64 / Re;
      else lambda = 0.316 / Math.pow(Re, 0.25);
      const dp = lambda * (i.L / (i.d / 1e3)) * (i.rho * v ** 2 / 2) / 1e5;
      return { v: v.toFixed(3), Re: Re.toFixed(0), type: laminar ? "\u5C64\u6D41 (Re<2300)" : "\u7D0A\u6D41 (Re\u22652300)", dp: dp.toFixed(4) };
    }
  },
  // ── 液壓衝擊 ──
  hydraulic_shock: {
    name: "\u6DB2\u58D3\u885D\u64CA\u8A08\u7B97",
    desc: "\u8A08\u7B97\u885D\u64CA\u6CE2\u901F\u5EA6\u8207\u6700\u5927\u58D3\u529B\u5347\u9AD8\u503C",
    inputs: [
      { key: "E0", label: "\u6DB2\u9AD4\u9AD4\u7A4D\u5F48\u6027\u6A21\u91CF E\u2080", unit: "GPa", default: 1.4 },
      { key: "rho", label: "\u6DB2\u9AD4\u5BC6\u5EA6 \u03C1", unit: "kg/m\xB3", default: 870 },
      { key: "d", label: "\u7BA1\u9053\u5167\u5F91 d", unit: "mm", default: 30 },
      { key: "delta", label: "\u7BA1\u58C1\u539A\u5EA6 \u03B4", unit: "mm", default: 5 },
      { key: "E", label: "\u7BA1\u6750\u5F48\u6027\u6A21\u91CF E", unit: "GPa", default: 206 },
      { key: "v1", label: "\u7BA1\u5167\u539F\u6D41\u901F v\u2081", unit: "m/s", default: 3 },
      { key: "v2", label: "\u95DC\u9589\u5F8C\u6D41\u901F v\u2082", unit: "m/s", default: 0 },
      { key: "L", label: "\u7BA1\u9053\u9577\u5EA6 L", unit: "m", default: 10 },
      { key: "t_close", label: "\u95DC\u9589\u6642\u9593 t", unit: "s", default: 0.05 }
    ],
    outputs: [
      { key: "alpha", label: "\u885D\u64CA\u6CE2\u901F\u5EA6 \u03B1", unit: "m/s" },
      { key: "T_wave", label: "\u5F80\u5FA9\u6642\u9593 T", unit: "s" },
      { key: "dp_direct", label: "\u76F4\u63A5\u885D\u64CA\u58D3\u5347 \u0394p", unit: "MPa" },
      { key: "dp_indirect", label: "\u9593\u63A5\u885D\u64CA\u58D3\u5347 \u0394p", unit: "MPa" },
      { key: "type", label: "\u885D\u64CA\u985E\u578B", unit: "" }
    ],
    calc(i) {
      const E0_Pa = i.E0 * 1e9, E_Pa = i.E * 1e9;
      const K = 1 / (1 / E0_Pa + i.d / 1e3 / (E_Pa * (i.delta / 1e3)));
      const alpha = Math.sqrt(K / i.rho);
      const T_wave = 2 * i.L / alpha;
      const dp_direct = alpha * i.rho * (i.v1 - i.v2) / 1e6;
      const dp_indirect = alpha * i.rho * (i.v1 - i.v2) * T_wave / i.t_close / 1e6;
      const isDirect = i.t_close <= T_wave;
      return { alpha: alpha.toFixed(1), T_wave: T_wave.toFixed(4), dp_direct: dp_direct.toFixed(3), dp_indirect: dp_indirect.toFixed(3), type: isDirect ? "\u76F4\u63A5\u885D\u64CA\uFF08t\u2264T\uFF09" : "\u9593\u63A5\u885D\u64CA\uFF08t\uFF1ET\uFF09" };
    }
  },
  // ── 蓄能器容積 ──
  accumulator: {
    name: "\u84C4\u80FD\u5668\u5BB9\u7A4D\u8A08\u7B97",
    desc: "\u4F9D\u5DE5\u4F5C\u5BB9\u7A4D\u8207\u58D3\u529B\u6BD4\u8A08\u7B97\u84C4\u80FD\u5668\u5BB9\u7A4D",
    inputs: [
      { key: "Vw", label: "\u5DE5\u4F5C\u5BB9\u7A4D Vw", unit: "L", default: 10 },
      { key: "P1", label: "\u6700\u4F4E\u5DE5\u4F5C\u58D3\u529B P\u2081", unit: "bar", default: 100 },
      { key: "P2", label: "\u6700\u9AD8\u5DE5\u4F5C\u58D3\u529B P\u2082", unit: "bar", default: 140 },
      { key: "P0", label: "\u5145\u6C23\u58D3\u529B P\u2080", unit: "bar", default: 85, hint: "\u901A\u5E38 P\u2080 = 0.6~0.9\xD7P\u2081" },
      { key: "n", label: "\u591A\u8B8A\u6307\u6578 n", unit: "", default: 1, hint: "\u7B49\u6EAB:1.0 / \u7D55\u71B1:1.4" }
    ],
    outputs: [
      { key: "V0", label: "\u84C4\u80FD\u5668\u5BB9\u7A4D V\u2080", unit: "L" },
      { key: "ratio", label: "\u58D3\u529B\u6BD4 P\u2082/P\u2081", unit: "" },
      { key: "check", label: "P\u2080 \u9A57\u7B97", unit: "" }
    ],
    calc(i) {
      const ratio = i.P2 / i.P1;
      const V0 = i.Vw / ((i.P0 / i.P1) ** (1 / i.n) - (i.P0 / i.P2) ** (1 / i.n));
      const ok = i.P0 >= 0.6 * i.P1 && i.P0 <= 0.9 * i.P1;
      return { V0: V0.toFixed(2), ratio: ratio.toFixed(3), check: ok ? "\u2705 P\u2080 \u8A2D\u5B9A\u5408\u7406" : "\u26A0\uFE0F \u5EFA\u8B70 P\u2080=0.6~0.9\xD7P\u2081" };
    }
  },
  // ── 耗氣量計算 ──
  air_consumption: {
    name: "\u6C23\u7F38\u8017\u6C23\u91CF\u8A08\u7B97",
    desc: "\u6700\u5927\u8017\u6C23\u91CF\u8207\u96FB\u78C1\u95A5 Cv \u503C\u9078\u578B",
    inputs: [
      { key: "D", label: "\u6C23\u7F38\u7F38\u5F91 D", unit: "mm", default: 63 },
      { key: "Vmax", label: "\u6700\u5927\u901F\u5EA6 Vmax", unit: "mm/s", default: 420 },
      { key: "P", label: "\u4F7F\u7528\u58D3\u529B P", unit: "MPa", default: 0.5 },
      { key: "L", label: "\u6C23\u7F38\u884C\u7A0B L", unit: "mm", default: 100 },
      { key: "freq", label: "\u6BCF\u5206\u9418\u5F80\u5FA9\u6578", unit: "\u6B21/min", default: 10 }
    ],
    outputs: [
      { key: "Q_max", label: "\u6700\u5927\u8017\u6C23\u91CF\uFF08\u81EA\u7531\u7A7A\u6C23\uFF09", unit: "L/min" },
      { key: "Cv", label: "\u6240\u9700\u96FB\u78C1\u95A5 Cv \u503C", unit: "" },
      { key: "Q_avg", label: "\u5E73\u5747\u8017\u6C23\u91CF", unit: "L/min" }
    ],
    calc(i) {
      const A = Math.PI / 4 * (i.D / 1e3) ** 2;
      const Q_max = A * i.Vmax / 1e3 * (i.P / 0.1013 + 1) * 1e3 * 60;
      const Cv = Q_max / 984;
      const Q_avg = 2 * A * (i.L / 1e3) * (i.P / 0.1013 + 1) * 1e3 * i.freq;
      return { Q_max: Q_max.toFixed(2), Cv: Cv.toFixed(4), Q_avg: Q_avg.toFixed(2) };
    }
  },
  // ── 倍速鏈電機功率 ──
  conveyor_chain: {
    name: "\u500D\u901F\u93C8\u96FB\u6A5F\u529F\u7387\u8A08\u7B97",
    desc: "\u8F38\u9001\u6A5F\u96FB\u6A5F\u9078\u578B\u8A08\u7B97",
    inputs: [
      { key: "V", label: "\u8F38\u9001\u901F\u5EA6 V", unit: "m/min", default: 20 },
      { key: "A", label: "\u901F\u5EA6\u500D\u901F A", unit: "", default: 2.5 },
      { key: "D", label: "\u8F38\u9001\u93C8\u8F2A\u76F4\u5F91 D", unit: "m", default: 0.164 },
      { key: "M1", label: "\u8F38\u9001\u5DE5\u4EF6\u7E3D\u91CD M1", unit: "kg", default: 1e3 },
      { key: "M2", label: "\u93C8\u689D\u91CD\u91CF M2", unit: "kg", default: 200 },
      { key: "M3", label: "\u8F49\u52D5\u7269\u91CD\u91CF M3", unit: "kg", default: 150 },
      { key: "mu2", label: "\u975C\u6469\u64E6\u4FC2\u6578 \u03BC", unit: "", default: 0.25 },
      { key: "eta1", label: "\u96FB\u6A5F\u6548\u7387 \u03B7\u2081", unit: "", default: 0.85 },
      { key: "eta2", label: "\u6A5F\u69CB\u6548\u7387 \u03B7\u2082", unit: "", default: 0.9 },
      { key: "t", label: "\u52A0\u901F\u6642\u9593 t", unit: "s", default: 0.2 }
    ],
    outputs: [
      { key: "Va", label: "\u93C8\u689D\u901F\u5EA6 Va", unit: "m/min" },
      { key: "T3", label: "\u514B\u670D\u6469\u64E6\u626D\u77E9 T3", unit: "N\xB7m" },
      { key: "Te", label: "\u9A45\u52D5\u8EF8\u6700\u5C0F\u626D\u77E9", unit: "N\xB7m" },
      { key: "P_kW", label: "\u96FB\u6A5F\u529F\u7387", unit: "kW" }
    ],
    calc(i) {
      const Va = i.V / i.A;
      const a = Va / (60 * i.t);
      const T1 = (i.M1 + i.M2) * a * i.D / 2;
      const T2 = i.M3 * a * i.D / 2 * 0.1;
      const T3 = (i.M1 + i.M2) * 9.8 * i.mu2 * i.D / 2;
      const Te = T1 + T2 + T3;
      const omega = Va / 60 / (i.D / 2);
      const P_kW = Te * omega / (i.eta1 * i.eta2 * 1e3);
      return { Va: Va.toFixed(2), T3: T3.toFixed(1), Te: Te.toFixed(1), P_kW: P_kW.toFixed(3) };
    }
  },
  // ── 油箱熱平衡 ──
  tank_thermal: {
    name: "\u6CB9\u7BB1\u71B1\u5E73\u8861\u8A08\u7B97",
    desc: "\u6563\u71B1\u9762\u7A4D\u3001\u71B1\u5E73\u8861\u6EAB\u5EA6\u3001\u98A8\u51B7/\u6C34\u51B7\u529F\u7387",
    inputs: [
      { key: "Pheat", label: "\u7CFB\u7D71\u767C\u71B1\u529F\u7387", unit: "kW", default: 11 },
      { key: "A", label: "\u6CB9\u7BB1\u6563\u71B1\u9762\u7A4D", unit: "m\xB2", default: 2 },
      { key: "k", label: "\u50B3\u71B1\u4FC2\u6578 k", unit: "W/(m\xB2\xB7K)", default: 8, hint: "\u901A\u98A8\u5DEE:6 / \u826F\u597D:10 / \u98A8\u51B7:15" },
      { key: "T0", label: "\u74B0\u5883\u6EAB\u5EA6 T\u2080", unit: "\xB0C", default: 30 },
      { key: "T_set", label: "\u8A2D\u5B9A\u6700\u9AD8\u6CB9\u6EAB T", unit: "\xB0C", default: 55 }
    ],
    outputs: [
      { key: "Pcool_need", label: "\u9700\u8981\u51B7\u537B\u529F\u7387", unit: "kW" },
      { key: "P_radiate", label: "\u6CB9\u7BB1\u81EA\u7136\u6563\u71B1", unit: "kW" },
      { key: "T_balance", label: "\u71B1\u5E73\u8861\u6EAB\u5EA6", unit: "\xB0C" },
      { key: "verdict", label: "\u6563\u71B1\u5224\u5B9A", unit: "" }
    ],
    calc(i) {
      const dT = i.T_set - i.T0;
      const P_radiate = i.k * i.A * dT / 1e3;
      const Pcool_need = Math.max(0, i.Pheat - P_radiate);
      const T_balance = i.Pheat * 1e3 / (i.k * i.A) + i.T0;
      return { Pcool_need: Pcool_need.toFixed(2), P_radiate: P_radiate.toFixed(2), T_balance: T_balance.toFixed(1), verdict: T_balance <= i.T_set ? "\u2705 \u81EA\u7136\u6563\u71B1\u8DB3\u5920" : "\u274C \u9700\u52A0\u88DD\u51B7\u537B\u5668" };
    }
  },
  ratchet_calc: {
    name: "\u68D8\u8F2A\u8A08\u7B97\uFF08CONTACT\u578B\uFF09",
    desc: "\u6599\u5E36\u68D8\u8F2A\u7BC0\u5713\u8207\u5E7E\u4F55\u5C3A\u5BF8",
    inputs: [{ key: "P", label: "\u6599\u5E36PITCH\u5B54\u8DDD P", unit: "mm", default: 5.3 }, { key: "T", label: "\u6599\u539A T", unit: "mm", default: 0.12 }, { key: "D", label: "PITCH\u5B54\u5F91 D", unit: "mm", default: 1 }, { key: "N", label: "\u68D8\u8F2A\u9F52\u6578 N", unit: "", default: 25 }],
    outputs: [{ key: "S", label: "\u7406\u8AD6\u5468\u9577 S", unit: "mm" }, { key: "D1", label: "\u7406\u8AD6\u76F4\u5F91 D\u2081", unit: "mm" }, { key: "D2", label: "\u5BE6\u969B\u76F4\u5F91 D\u2082", unit: "mm" }, { key: "D3", label: "\u8170\u9AD8 D\u2083", unit: "mm" }],
    calc(i) {
      const S = i.P * i.N, D1 = S / Math.PI;
      return { S: S.toFixed(3), D1: D1.toFixed(5), D2: (D1 - 2 * i.T).toFixed(5), D3: (2.25 * i.T).toFixed(3) };
    }
  },
  // ══ 單位換算 ══
  unit_pressure: { _type: "unit_pressure", name: "\u58D3\u529B\u55AE\u4F4D\u63DB\u7B97", desc: "Pa/kPa/MPa/bar/atm/psi \u4E92\u63DB" },
  unit_power: {
    name: "\u529F\u7387\u55AE\u4F4D\u63DB\u7B97",
    desc: "W / kW / hp / PS \u4E92\u63DB",
    inputs: [{ key: "val", label: "\u8F38\u5165\u503C", unit: "", default: 1 }, { key: "from", label: "\u55AE\u4F4D (1=W 2=kW 3=hp 4=PS)", unit: "", default: 2 }],
    outputs: [{ key: "W", label: "W" }, { key: "kW", label: "kW" }, { key: "hp", label: "hp\uFF08\u82F1\u5236\uFF09" }, { key: "PS", label: "PS\uFF08\u516C\u5236\u99AC\u529B\uFF09" }],
    calc(i) {
      const f = [1, 1e3, 745.7, 735.5][Math.round(i.from) - 1] || 1;
      const w = i.val * f;
      return { W: w.toFixed(2), kW: (w / 1e3).toFixed(4), hp: (w / 745.7).toFixed(4), PS: (w / 735.5).toFixed(4) };
    }
  },
  unit_torque: {
    name: "\u8F49\u77E9\u55AE\u4F4D\u63DB\u7B97",
    desc: "N\xB7m / kN\xB7m / kgf\xB7m / lbf\xB7ft \u4E92\u63DB",
    inputs: [{ key: "val", label: "\u8F38\u5165\u503C", unit: "", default: 10 }, { key: "from", label: "\u55AE\u4F4D (1=N\xB7m 2=kN\xB7m 3=kgf\xB7m 4=lbf\xB7ft)", unit: "", default: 1 }],
    outputs: [{ key: "Nm", label: "N\xB7m" }, { key: "kNm", label: "kN\xB7m" }, { key: "kgfm", label: "kgf\xB7m" }, { key: "lbft", label: "lbf\xB7ft" }],
    calc(i) {
      const f = [1, 1e3, 9.807, 1.35582][Math.round(i.from) - 1] || 1;
      const nm = i.val * f;
      return { Nm: nm.toFixed(4), kNm: (nm / 1e3).toFixed(6), kgfm: (nm / 9.807).toFixed(4), lbft: (nm / 1.35582).toFixed(4) };
    }
  },
  unit_length: {
    name: "\u9577\u5EA6\u55AE\u4F4D\u63DB\u7B97",
    desc: "mm / cm / m / in / ft \u4E92\u63DB",
    inputs: [{ key: "val", label: "\u8F38\u5165\u503C", unit: "", default: 100 }, { key: "from", label: "\u55AE\u4F4D (1=mm 2=cm 3=m 4=in 5=ft)", unit: "", default: 1 }],
    outputs: [{ key: "mm", label: "mm" }, { key: "cm", label: "cm" }, { key: "m", label: "m" }, { key: "inch", label: "inch" }, { key: "ft", label: "ft" }],
    calc(i) {
      const f = [1, 10, 1e3, 25.4, 304.8][Math.round(i.from) - 1] || 1;
      const mm = i.val * f;
      return { mm: mm.toFixed(4), cm: (mm / 10).toFixed(4), m: (mm / 1e3).toFixed(6), inch: (mm / 25.4).toFixed(5), ft: (mm / 304.8).toFixed(6) };
    }
  },
  // ══ 查詢型（特殊 _type） ══
  bearing_lookup: { _type: "bearing_lookup", name: "\u6DF1\u6E9D\u7403\u8EF8\u627F\u67E5\u8A62", desc: "\u4F9D\u5167\u5F91\u6216\u578B\u865F\u641C\u5C0B" },
  bearing_thrust_lookup: { _type: "bearing_thrust_lookup", name: "\u63A8\u529B\u7403\u8EF8\u627F\u67E5\u8A62", desc: "\u4F9D\u5167\u5F91\u6216\u578B\u865F\u641C\u5C0B" },
  it_tolerance: { _type: "it_tolerance", name: "IT\u516C\u5DEE\u7B49\u7D1A\u67E5\u8A62", desc: "\u4F9D\u57FA\u672C\u5C3A\u5BF8\u67E5 IT5~IT11" },
  material_elastic: { _type: "material_elastic", name: "\u5F48\u6027\u6A21\u91CF & \u6CCA\u677E\u6BD4", desc: "\u5E38\u7528\u6750\u6599\u5F48\u6027\u6A21\u91CF\u67E5\u8A62" },
  material_density: { _type: "material_density", name: "\u6750\u6599\u5BC6\u5EA6\u67E5\u8A62", desc: "\u5E38\u7528\u91D1\u5C6C\u8207\u5DE5\u7A0B\u6750\u6599\u5BC6\u5EA6" },
  material_friction: { _type: "material_friction", name: "\u6750\u6599\u6469\u64E6\u4FC2\u6578", desc: "\u5E38\u7528\u6750\u6599\u526F\u6469\u64E6\u4FC2\u6578" },
  bolt_torque_lookup: { _type: "bolt_torque_lookup", name: "\u87BA\u6813\u9396\u7DCA\u626D\u77E9\u6A19\u6E96", desc: "M6~M100 \u65E5\u672C/DIN \u6A19\u6E96\u626D\u77E9" }
};
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#111;--secondary:#666;--border-color:#e0e0e0;
  --bg-light:#f5f5f5;--bg-white:#fff;
  --accent2:#2e7d32;--warn:#c62828;--muted:#888;
  --brand-50:#f5f5f5;--border:#e0e0e0;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --mono:'IBM Plex Mono',monospace;
  --sans:'DM Sans','Noto Sans TC',sans-serif;
  --primary-color:#111;
}
@media(prefers-color-scheme:dark){:root{
  --primary:#f0f0f0;--primary-color:#f0f0f0;--secondary:#999;--border-color:#2a2a2a;
  --bg-light:#181818;--bg-white:#0d0d0d;
  --accent2:#66bb6a;--warn:#ef5350;--muted:#777;
  --brand-50:#181818;--border:#2a2a2a;
}}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;color:var(--primary);background:var(--bg-white);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px}
.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{
  position:fixed;top:56px;left:0;bottom:0;width:200px;
  background:var(--bg-white);border-right:0.5px solid var(--border-color);overflow-y:auto;z-index:50;
}
.sidebar-header{padding:14px 16px 10px;border-bottom:0.5px solid var(--border-color)}
.sidebar-header h1{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--primary);text-transform:uppercase}
.sidebar-header p{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--primary);text-transform:uppercase;margin-top:2px}
.search-box{display:block;margin:8px 10px 4px;width:calc(100% - 20px);padding:6px 10px;border:0.5px solid var(--border-color);border-radius:var(--radius-sm);background:var(--bg-light);font:inherit;font-size:13px;color:var(--primary);outline:none}
.search-box:focus{border-color:var(--primary)}
.search-box::placeholder{color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--secondary);border-left:2px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--primary);background:var(--bg-light)}
.nav-item.active{color:var(--primary);border-left-color:var(--primary);background:var(--brand-50);font-weight:600}
.nav-icon{font-size:13px;width:18px;text-align:center}
.main{margin-left:200px;display:flex;flex-direction:column;min-height:calc(100vh - 56px)}
.topbar{padding:18px 24px 12px;border-bottom:0.5px solid var(--border-color)}
.topbar h2{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;letter-spacing:.3px;color:var(--primary)}
.topbar p{font-size:12px;color:var(--secondary);margin-top:3px}
.content{flex:1;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-content:start}
.home-grid{flex:1;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.card{background:var(--bg-light);border:0.5px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden}
.card-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);padding:14px 16px 0;margin-bottom:10px}
.card-desc{font-size:13px;color:var(--muted);margin:-6px 16px 10px;line-height:1.5}
.home-card{background:var(--bg-light);border:0.5px solid var(--border-color);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.home-card .icon{font-size:26px;margin-bottom:8px}
.home-card .name{font-size:15px;font-weight:700;color:var(--primary)}
.home-card .count{font-size:12px;color:var(--secondary);margin-top:3px}
.field{padding:0 16px;margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--secondary);margin-bottom:5px;letter-spacing:.3px}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.field-row{display:flex;align-items:center;gap:6px}
.field input{flex:1;padding:8px 10px;border:0.5px solid var(--border-color);border-radius:var(--radius-sm);background:var(--bg-white);font:inherit;font-family:var(--mono);font-size:15px;color:var(--primary);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--primary)}
.field .unit-tag{font-size:13px;color:var(--muted);min-width:44px;text-align:right;font-family:var(--mono)}
.calc-btn{display:block;width:calc(100% - 32px);margin:12px 16px 16px;padding:9px 0;border:none;border-radius:var(--radius-sm);background:var(--primary);color:var(--bg-white);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;letter-spacing:.3px}
.calc-btn:hover{opacity:.8}
.results-divider{margin:0 16px 14px;border-top:0.5px solid var(--border-color);padding-top:12px}
.result-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:0.5px solid var(--border-color)}
.result-row:last-child{border-bottom:none}
.result-label{font-size:13px;color:var(--secondary);font-weight:500}
.result-val{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--primary)}
.result-unit{font-size:10.5px;color:var(--muted);margin-left:3px}
.verdict-ok{color:var(--accent2)!important}
.verdict-ng{color:var(--warn)!important}
.link-btn{padding:7px 10px;border:0.5px solid var(--border-color);border-radius:var(--radius-sm);background:var(--bg-white);color:var(--secondary);font:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.link-btn:hover{border-color:var(--primary);color:var(--primary)}
.lookup-input{display:flex;gap:8px;margin:0 16px 12px}
.lookup-input input,.lookup-input select{flex:1;padding:7px 10px;border:0.5px solid var(--border-color);border-radius:var(--radius-sm);background:var(--bg-white);font:inherit;font-size:13px;color:var(--primary);outline:none}
.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
.data-table th{text-align:left;padding:7px 10px;font-size:11px;font-weight:700;color:var(--secondary);border-bottom:0.5px solid var(--border-color);background:var(--bg-white)}
.data-table td{padding:6px 10px;border-bottom:0.5px solid var(--border-color);font-family:var(--mono);color:var(--primary)}
.data-table tr:hover td{background:var(--brand-50)}
.it-table{width:calc(100% - 32px);border-collapse:collapse;font-size:11.5px;margin:0 16px 4px}
.it-table th{padding:6px 8px;text-align:center;font-size:10.5px;font-weight:700;color:var(--secondary);border-bottom:0.5px solid var(--border-color)}
.it-table td{padding:6px 8px;text-align:center;font-family:var(--mono);border-bottom:0.5px solid var(--border-color)}
.it-table tr.hl td{background:var(--bg-white);color:var(--primary);font-weight:700;border:0.5px solid var(--border-color)}
.it-badge{display:inline-block;padding:2px 7px;border-radius:var(--radius-sm);background:var(--bg-white);border:0.5px solid var(--border-color);font-family:var(--mono);font-size:12px;margin:3px 3px 0 0;color:var(--primary)}
.conv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px 14px}
.conv-item{background:var(--bg-white);border:0.5px solid var(--border-color);border-radius:var(--radius-sm);padding:8px 10px}
.conv-item label{font-size:10.5px;color:var(--secondary);font-weight:600}
.conv-item .val{font-family:var(--mono);font-size:14px;color:var(--primary);margin-top:2px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.content,.home-grid{padding:16px}}
